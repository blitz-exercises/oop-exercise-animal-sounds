# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
tone_instructions: "Be concise and focus on critical issues only"
early_access: false
enable_free_tier: true

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_placeholder: '@coderabbitai summary'
  auto_title_placeholder: '@coderabbitai'
  poem: false
  review_status: true
  collapse_walkthrough: false

  # Focus reviews on source files
  path_filters:
    - "src/**"

  # Reviewer guidance (non-blocking instructions)
  path_instructions:
    - path: "src/main/java/**"
      instructions: |
        nl.blitz.oop.animal exercise — apply these during review:

        • Package hygiene
          - All classes declare: package nl.blitz.oop.animal;

        • Files / Classes
          - Ensure these files exist:
              src/main/java/nl/blitz/oop/animal/Animal.java
              src/main/java/nl/blitz/oop/animal/Dog.java
              src/main/java/nl/blitz/oop/animal/Cat.java
              src/main/java/nl/blitz/oop/animal/Cow.java
              src/main/java/nl/blitz/oop/animal/Demo.java
          - Animal.java declares: public abstract class Animal
          - Dog/Cat/Cow extend Animal
          - Demo.java declares: public class Demo with public static void main(String[] args)

        • Encapsulation
          - Animal.name is private (prefer final)
          - No public mutable fields across the package

        • Constructor validation
          - Animal(String) validates name non-null/non-blank
          - Throws IllegalArgumentException on invalid input (message text not enforced)

        • Abstraction and overriding
          - Animal declares: public abstract String makeSound();
          - Dog/Cat/Cow override makeSound() and return species-appropriate strings
            (e.g., "woof", "meow", "moo")

        • Implementation
          - getName() and subclass makeSound() must be implemented and must NOT throw UnsupportedOperationException

        • Polymorphism in Demo
          - Demo.main creates a List<Animal>
          - Adds instances of Dog, Cat, Cow
          - Iterates and prints "<name>: <sound>" by calling animal.getName() and animal.makeSound()
          - NO instanceof checks allowed

  auto_review:
    enabled: true
    auto_incremental_review: true
    ignore_title_keywords:
      - "wip"
      - "draft"
    labels: []
    drafts: false
    base_branches: []

pre_merge_checks:
  title:
    mode: warning
    requirements: "Title should be concise and descriptive"
  description:
    mode: warning
  issue_assessment:
    mode: warning
  custom_checks:
    - mode: error
      name: "Files exist"
      instructions: >
        Fail if any required file is missing or mislocated.

    - mode: error
      name: "Package hygiene"
      instructions: >
        Fail if package declaration 'package nl.blitz.oop.animal;' is missing in any class.

    - mode: error
      name: "Abstract base contract"
      instructions: >
        Fail if Animal.java is not abstract or does not declare
        'public abstract String makeSound();'.

    - mode: error
      name: "Inheritance structure"
      instructions: >
        Fail if Dog, Cat, or Cow do not contain 'extends Animal'.

    - mode: error
      name: "Constructor validation"
      instructions: >
        Fail if Animal(String) constructor does not validate name non-null/non-blank
        and throw IllegalArgumentException when invalid.

    - mode: error
      name: "Encapsulation"
      instructions: >
        Fail if Animal.name is not private, or if any public mutable fields exist in this package.

    - mode: error
      name: "Method implementation"
      instructions: >
        Fail if Animal.getName() or any makeSound() implementation throws UnsupportedOperationException
        or is missing. Methods must return appropriate values.

    - mode: error
      name: "Polymorphism in Demo"
      instructions: >
        Fail if Demo.main does not create a List<Animal>, add multiple Animal subclasses,
        and print '<name>: <sound>' by calling animal methods directly without 'instanceof' checks.

tools:
  github-checks:
    enabled: true
    timeout_ms: 90000
  markdownlint:
    enabled: true
  yamllint:
    enabled: true
  gitleaks:
    enabled: true
  # Optional static analyzers (kept enabled, but not required for gating)
  pmd:
    enabled: true
  semgrep:
    enabled: true

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    filePatterns:
      - "**/.cursorrules"
      - "**/CODING_STANDARDS.md"

code_generation:
  docstrings:
    language: en-US
  unit_tests:
    path_instructions: []

